<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>
    {{ title }} · ComicCraft
  </title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', path='css/styles.css') }}"
  >

</head>

<body>

<header class="header">

  <a
    class="brand"
    href="/"
  >
    ComicCraft
  </a>

  <span>
    AI Comic Story Creator
  </span>

</header>

<main class="container">

  {% block content %}
  {% endblock %}

</main>

<footer class="footer">

  <span>
    ComicCraft
  </span>

  <a href="/docs">
    API Docs
  </a>

</footer>

<script
  src="{{ url_for('static', path='js/app.js') }}"
></script>

</body>

</html>
